<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Random — Jacob</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page-shell">
    <header class="topbar">
      <a class="logo" href="index.html">JACOB<span>.</span></a>
      <nav>
        <a href="about.html">About</a>
        <a href="random.html" class="active">Random</a>
        <a href="game.html">Game</a>
        <button id="themeToggle" class="icon-btn" aria-label="Đổi giao diện">◐</button>
      </nav>
    </header>

    <main class="content random-page">
      <p class="eyebrow">RANDOM</p>
      <div class="random-card">
        <div class="random-symbol" id="randomSymbol">✦</div>
        <p id="randomText">Bấm nút bên dưới.</p>
      </div>
      <button class="primary-btn" id="randomBtn">Cho tôi một thứ ngẫu nhiên</button>
      <a class="text-link" href="index.html">← Về trang chủ</a>
    </main>

    <footer class="footer">
      <span>© <span id="year"></span> Jacob</span>
      <span>Made for fun.</span>
    </footer>
  </div>
  <script src="script.js"></script>
  <script>
    const randomItems = [
      ["☕", "Có lẽ bạn nên uống một cốc nước."],
      ["🌱", "Mọi thứ đều bắt đầu từ một bước rất nhỏ."],
      ["💡", "Ý tưởng hôm nay có thể trở thành thứ thú vị ngày mai."],
      ["🌤️", "Không cần hôm nào cũng phải thật đặc biệt."],
      ["🎈", "Đôi khi làm một thứ vô nghĩa cũng rất vui."],
      ["🪴", "Một ngày bình thường cũng là một ngày đáng sống."],
      ["🧠", "Nếu có thể học một điều mới hôm nay, bạn sẽ chọn gì?"],
      ["🚶", "Đi bộ một chút. Có thể bạn sẽ nghĩ ra điều gì đó."],
      ["🎲", "Con số may mắn của bạn hôm nay là " + (Math.floor(Math.random()*99)+1) + "."],
      ["✨", "Bạn đang ở đây. Thế là đủ."]
    ];
    function newRandom() {
      const item = randomItems[Math.floor(Math.random() * randomItems.length)];
      document.getElementById("randomSymbol").textContent = item[0];
      const el = document.getElementById("randomText");
      el.classList.remove("pop");
      void el.offsetWidth;
      el.textContent = item[1];
      el.classList.add("pop");
    }
    document.getElementById("randomBtn").addEventListener("click", newRandom);
    newRandom();
  </script>
</body>
</html>
