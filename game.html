<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Game — Thắng</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page-shell">
    <header class="topbar">
      <a class="logo" href="index.html">THẮNG<span>.</span></a>
      <nav>
        <a href="about.html">About</a>
        <a href="random.html">Random</a>
        <a href="game.html" class="active">Game</a>
        <button id="themeToggle" class="icon-btn" aria-label="Đổi giao diện">◐</button>
      </nav>
    </header>

    <main class="content game-page">
      <p class="eyebrow">MINI GAME</p>
      <h1>Đoán số.</h1>
      <p class="muted">Tôi đang nghĩ một số từ 1 đến 100.</p>

      <div class="game-box">
        <form id="guessForm">
          <label for="guess">Số bạn đoán</label>
          <div class="guess-row">
            <input id="guess" type="number" min="1" max="100" inputmode="numeric" autocomplete="off" required>
            <button class="primary-btn" type="submit">Đoán</button>
          </div>
        </form>
        <p class="game-message" id="gameMessage">Bạn có thể bắt đầu.</p>
        <p class="attempts">Lần đoán: <strong id="attempts">0</strong></p>
        <p class="best">Kỷ lục: <strong id="best">—</strong></p>
        <button class="secondary-btn" id="newGame" type="button">Chơi lại</button>
      </div>

      <a class="text-link" href="index.html">← Về trang chủ</a>
    </main>

    <footer class="footer">
      <span>© <span id="year"></span> Thắng</span>
      <span>Made for fun.</span>
    </footer>
  </div>
  <script src="script.js"></script>
  <script>
    let secret = Math.floor(Math.random() * 100) + 1;
    let attempts = 0;
    const input = document.getElementById("guess");
    const message = document.getElementById("gameMessage");
    const attemptsEl = document.getElementById("attempts");
    const bestEl = document.getElementById("best");
    const storedBest = localStorage.getItem("guessBest");
    if (storedBest) bestEl.textContent = storedBest;

    document.getElementById("guessForm").addEventListener("submit", e => {
      e.preventDefault();
      const value = Number(input.value);
      if (!value || value < 1 || value > 100) return;
      attempts++;
      attemptsEl.textContent = attempts;

      if (value === secret) {
        message.textContent = `🎉 Chính xác! Bạn cần ${attempts} lần.`;
        input.disabled = true;
        if (!storedBest || attempts < Number(storedBest)) {
          localStorage.setItem("guessBest", attempts);
          bestEl.textContent = attempts;
          message.textContent += " Kỷ lục mới!";
        }
      } else if (value < secret) {
        message.textContent = "↑ Cao hơn một chút.";
      } else {
        message.textContent = "↓ Thấp hơn một chút.";
      }
      input.select();
    });

    document.getElementById("newGame").addEventListener("click", () => {
      secret = Math.floor(Math.random() * 100) + 1;
      attempts = 0;
      attemptsEl.textContent = "0";
      message.textContent = "Một con số mới đang chờ bạn.";
      input.disabled = false;
      input.value = "";
      input.focus();
    });
  </script>
</body>
</html>
